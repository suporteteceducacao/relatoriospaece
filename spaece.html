<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPAECE Analytics V11.0 | Dashboard Enterprise</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/css/iziToast.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/js/iziToast.min.js"></script>

    <style>
        :root {
            --primary: #0f172a; --accent: #4f46e5; --sidebar-w: 300px;
            --glass: rgba(255, 255, 255, 0.9); --bg-body: #f1f5f9;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); overflow-x: hidden; }

        /* Estilo Login */
        #login-overlay {
            position: fixed; inset: 0; z-index: 9999; background: var(--primary);
            display: flex; align-items: center; justify-content: center; transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .login-box {
            background: var(--glass); padding: 40px; border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); width: 100%; max-width: 420px; text-align: center;
            backdrop-filter: blur(10px);
        }

        /* Sidebar Glassmorphism */
        #sidebar { 
            width: var(--sidebar-w); height: 100vh; position: fixed; 
            background: var(--primary); color: white; z-index: 1000;
        }
        
        #content { margin-left: var(--sidebar-w); min-height: 100vh; padding: 40px; transition: 0.3s; }

        .glass-card {
            background: white; border-radius: 20px; border: 1px solid rgba(0,0,0,0.05);
            padding: 30px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); margin-bottom: 30px;
            position: relative; transition: transform 0.2s;
        }
        
        .glass-card:hover { transform: translateY(-5px); }

        .btn-png { position: absolute; top: 15px; right: 15px; font-size: 11px; font-weight: 700; border-radius: 8px; }

        .kpi-card { text-align: center; padding: 20px; border-radius: 15px; color: white; height: 100%; }

        .nav-pills .nav-link { 
            color: #64748b; font-weight: 600; border-radius: 12px; 
            padding: 12px 20px; transition: 0.3s;
        }
        .nav-pills .nav-link.active { background: var(--accent); box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4); }

        .table-custom { font-size: 0.9rem; }
        .table-custom thead { background: #f8fafc; }

        footer { text-align: center; padding: 30px; color: #94a3b8; font-size: 0.8rem; border-top: 1px solid #e2e8f0; margin-top: 50px; }

        @media (max-width: 992px) {
            #sidebar { transform: translateX(-100%); }
            #content { margin-left: 0; }
            #sidebar.active { transform: translateX(0); }
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box animate__animated animate__zoomIn">
        <img src="https://via.placeholder.com/150x60?text=SPAECE+2026" class="mb-4">
        <h2 class="fw-800 text-dark mb-1">Analytics Pro</h2>
        <p class="text-muted mb-4 small">Setor de Monitoramento e Resultados</p>
        <div class="form-floating mb-3">
            <input type="text" id="inepInput" class="form-control" placeholder="INEP">
            <label for="inepInput">Código INEP da Escola</label>
        </div>
        <button class="btn btn-primary w-100 btn-lg rounded-4 shadow" onclick="validarAcesso()">
            Entrar no Sistema <i class="fas fa-arrow-right ms-2"></i>
        </button>
    </div>
</div>

<div id="wrapper" style="display:none;">
    <aside id="sidebar">
        <div class="p-4 text-center">
            <div class="mb-3"><i class="fas fa-chart-line fa-3x text-accent"></i></div>
            <h5 class="fw-bold mb-0">PAINEL SPAECE</h5>
            <small class="text-white-50">v11.0 Enterprise</small>
        </div>

        <div class="p-4 mt-2">
            <div class="mb-3">
                <label class="small fw-bold text-white-50 mb-2">MUNICÍPIO</label>
                <div id="displayMun" class="form-control bg-dark text-white border-secondary small">---</div>
            </div>
            <div class="mb-3">
                <label class="small fw-bold text-white-50 mb-2">ETAPA</label>
                <select id="selEtapa" class="form-select bg-dark text-white border-secondary" onchange="filtraComponentes()"></select>
            </div>
            <div class="mb-4">
                <label class="small fw-bold text-white-50 mb-2">COMPONENTE</label>
                <select id="selComp" class="form-select bg-dark text-white border-secondary" onchange="renderizarDashboard()"></select>
            </div>
            
            <button class="btn btn-outline-danger w-100 mb-2 rounded-3" onclick="confirmarSair()">
                <i class="fas fa-redo me-2"></i>Nova Consulta
            </button>
            <button class="btn btn-success w-100 rounded-3 shadow" onclick="exportarRelatorioPDF()">
                <i class="fas fa-file-pdf me-2"></i>Gerar Relatório PDF
            </button>
        </div>
    </aside>

    <main id="content">
        <header class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <h1 id="headerEscola" class="fw-800 text-primary mb-0">---</h1>
                <p id="headerInep" class="text-muted mb-0 fw-600"></p>
            </div>
            <div class="text-end">
                <span class="badge bg-white text-primary shadow-sm p-3 rounded-pill fw-bold">
                    <i class="fas fa-calendar-alt me-2"></i>SÉRIE HISTÓRICA
                </span>
            </div>
        </header>

        <ul class="nav nav-pills mb-5 no-print" id="pills-tab">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-geral">RESULTADOS</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-dist">DISTRIBUIÇÃO</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-hist">COMPARATIVO</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-quartil">ANÁLISE QUARTIL</button></li>
        </ul>

        <div id="print-zone">
            <div class="tab-content">
                <div class="tab-pane fade show active" id="tab-geral">
                    <div id="cardsResultados" class="row g-4"></div>
                </div>

                <div class="tab-pane fade" id="tab-dist">
                    <div id="graficosContainer" class="row"></div>
                </div>

                <div class="tab-pane fade" id="tab-hist">
                    <div id="tabelaVariacao" class="glass-card table-responsive"></div>
                </div>

                <div class="tab-pane fade" id="tab-quartil">
                    <div id="quartilView" class="row"></div>
                </div>
            </div>
        </div>

        <footer>
            <p class="mb-0 fw-bold">© 2026 SME Maracanaú - Setor de Processamento e Monitoramento de Resultados</p>
            <small>Este relatório utiliza cálculos oficiais baseados nos dados do SPAECE/Alfa.</small>
        </footer>
    </main>
</div>

<script>
let dataCompleta = [];
let escolaAtiva = null;

// Configuração Global Chart.js
Chart.register(ChartDataLabels);
Chart.defaults.font.family = "'Inter', sans-serif";

// 1. Carregamento de Dados
async function carregarBases() {
    try {
        const [resS, resA] = await Promise.all([
            fetch('result_spaece.json').then(r => r.json()),
            fetch('result_alfa.json').then(r => r.json())
        ]);
        dataCompleta = [...resS, ...resA];
        iziToast.info({ title: 'Pronto', message: 'Base de dados carregada.', position: 'topRight' });
    } catch (e) {
        iziToast.error({ title: 'Erro', message: 'Falha ao ler arquivos JSON.' });
    }
}

// 2. Lógica de Acesso
function validarAcesso() {
    const inep = document.getElementById('inepInput').value;
    const find = dataCompleta.find(d => String(d.INEP_ESC || d.INEP) === inep);

    if (find) {
        iziToast.success({ title: 'Sucesso', message: 'Escola localizada!', position: 'center' });
        escolaAtiva = inep;
        
        document.getElementById('login-overlay').style.transform = 'translateY(-100%)';
        setTimeout(() => {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('wrapper').style.display = 'block';
            iniciarInterface(find);
        }, 800);
    } else {
        iziToast.error({ title: 'Negado', message: 'Código INEP inválido.' });
    }
}

// 3. Inicialização e Filtros
function iniciarInterface(f) {
    document.getElementById('displayMun').innerText = f.MUNICIPIO || "MUNICÍPIO";
    const etapas = [...new Set(dataCompleta.filter(d => String(d.INEP_ESC || d.INEP) === escolaAtiva).map(d => d.ETAPA))];
    const selEtapa = document.getElementById('selEtapa');
    selEtapa.innerHTML = etapas.map(e => `<option value="${e}">${e}</option>`).join('');
    
    filtraComponentes();
}

function filtraComponentes() {
    const etapa = document.getElementById('selEtapa').value;
    const comps = [...new Set(dataCompleta.filter(d => String(d.INEP_ESC || d.INEP) === escolaAtiva && d.ETAPA === etapa).map(d => d.COMPONENTE_CURRICULAR || d.DISCIPLINA))];
    const selComp = document.getElementById('selComp');
    selComp.innerHTML = comps.map(c => `<option value="${c}">${c}</option>`).join('');
    
    renderizarDashboard();
}

// 4. Renderização do Painel
function renderizarDashboard() {
    const etapa = document.getElementById('selEtapa').value;
    const comp = document.getElementById('selComp').value;
    const rows = dataCompleta.filter(d => String(d.INEP_ESC || d.INEP) === escolaAtiva && d.ETAPA === etapa && (d.COMPONENTE_CURRICULAR === comp || d.DISCIPLINA === comp))
                             .sort((a,b) => a.EDICAO - b.EDICAO);

    if(!rows.length) return;

    document.getElementById('headerEscola').innerText = rows[0].ESCOLA;
    document.getElementById('headerInep').innerText = "INEP: " + escolaAtiva + " | " + etapa;

    renderCards(rows);
    renderGraficos(rows, etapa);
    renderHistorico(rows);
    renderQuartil(rows, etapa, comp);
}

// 5. Funções de Componente
function renderCards(rows) {
    const cont = document.getElementById('cardsResultados');
    cont.innerHTML = '';
    rows.forEach(row => {
        const adeq = Math.round(row.PERCENTUAL_ADEQUADO || row.DESEJAVEL || 0);
        const cor = adeq > 70 ? '#10b981' : adeq > 40 ? '#f59e0b' : '#ef4444';
        cont.innerHTML += `
            <div class="col-md-3">
                <div class="kpi-card shadow-sm animate__animated animate__fadeInUp" style="background:${cor}">
                    <small class="fw-bold opacity-75">EDIÇÃO ${row.EDICAO}</small>
                    <h2 class="fw-800 mb-0">${adeq}%</h2>
                    <p class="small mb-0">Proficiência: ${Math.round(row.PROFICIENCIA_MEDIA || 0)}</p>
                </div>
            </div>`;
    });
}

function renderGraficos(rows, etapa) {
    const cont = document.getElementById('graficosContainer');
    cont.innerHTML = '';
    rows.forEach((row, i) => {
        const cardId = `chart-card-${i}`;
        const ctxId = `ctx-${i}`;
        cont.innerHTML += `
            <div class="col-md-6 mb-4">
                <div class="glass-card h-100" id="${cardId}">
                    <button class="btn btn-light btn-sm btn-png no-print" onclick="baixarPNG('${cardId}', 'Spaece_${row.EDICAO}')">
                        <i class="fas fa-image me-1"></i>PNG
                    </button>
                    <h6 class="fw-bold text-dark border-bottom pb-2 mb-3">Distribuição Níveis - ${row.EDICAO}</h6>
                    <div style="height:250px"><canvas id="${ctxId}"></canvas></div>
                </div>
            </div>`;
        
        setTimeout(() => criarGraficoBarra(ctxId, row, etapa), 100);
    });
}

function criarGraficoBarra(id, row, etapa) {
    let labels, vals, cores;
    if(etapa === '2º Ano') {
        labels = ['Não Alfab.', 'Incompleta', 'Interm.', 'Sufic.', 'Desejável'];
        vals = [row.NAO_ALFABETIZADOS, row.ALFABETIZACAO_INCOMPLETA, row.INTERMEDIARIO, row.SUFICIENTE, row.DESEJAVEL];
        cores = ['#ef4444', '#f87171', '#fbbf24', '#34d399', '#059669'];
    } else {
        labels = ['Muito Crítico', 'Crítico', 'Intermediário', 'Adequado'];
        vals = [row.MUITO_CRITICO, row.CRITICO, row.INTERMEDIARIO, row.ADEQUADO];
        cores = ['#dc2626', '#fbbf24', '#34d399', '#059669'];
    }

    new Chart(document.getElementById(id), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{ data: vals.map(v => Math.round(v || 0)), backgroundColor: cores, borderRadius: 8 }]
        },
        options: {
            maintainAspectRatio: false,
            plugins: { legend: { display: false }, datalabels: { color: '#000', anchor: 'end', align: 'top', formatter: v => v + '%' } },
            scales: { y: { display: false, max: 100 }, x: { grid: { display: false } } }
        }
    });
}

function renderHistorico(rows) {
    const cont = document.getElementById('tabelaVariacao');
    let html = `
        <h5 class="fw-bold mb-4"><i class="fas fa-history me-2 text-accent"></i>Série Histórica e Evolução</h5>
        <table class="table table-custom align-middle">
            <thead>
                <tr>
                    <th>Edição</th>
                    <th>Proficiência Média</th>
                    <th>Variação Pontos</th>
                    <th>Crescimento %</th>
                </tr>
            </thead>
            <tbody>`;
    
    rows.forEach((row, i) => {
        let diff = 0, pct = 0;
        if(i > 0) {
            diff = (row.PROFICIENCIA_MEDIA || 0) - (rows[i-1].PROFICIENCIA_MEDIA || 0);
            pct = (diff / rows[i-1].PROFICIENCIA_MEDIA) * 100;
        }
        
        html += `
            <tr>
                <td class="fw-bold">${row.EDICAO}</td>
                <td>${Math.round(row.PROFICIENCIA_MEDIA || 0)}</td>
                <td class="${diff >= 0 ? 'text-success' : 'text-danger'} fw-bold">
                    ${i === 0 ? '-' : (diff > 0 ? '+' : '') + Math.round(diff)}
                </td>
                <td>
                    <span class="badge ${diff >= 0 ? 'bg-success' : 'bg-danger'}">
                        ${i === 0 ? 'Início' : Math.round(pct) + '%'}
                    </span>
                </td>
            </tr>`;
    });
    
    html += `</tbody></table>`;
    cont.innerHTML = html;
}

function renderQuartil(rows, etapa, comp) {
    const cont = document.getElementById('quartilView');
    const ultimaEdicao = rows[rows.length - 1];
    
    // Simulação de cálculo de Quartil (Lógica similar ao Streamlit)
    const totalEscolas = dataCompleta.filter(d => d.ETAPA === etapa && (d.COMPONENTE_CURRICULAR === comp || d.DISCIPLINA === comp) && d.EDICAO === ultimaEdicao.EDICAO);
    const profs = totalEscolas.map(e => e.PROFICIENCIA_MEDIA).sort((a,b) => a-b);
    
    const q1 = profs[Math.floor(profs.length * 0.25)];
    const q2 = profs[Math.floor(profs.length * 0.50)];
    const q3 = profs[Math.floor(profs.length * 0.75)];
    
    const minhaProf = ultimaEdicao.PROFICIENCIA_MEDIA;
    let rank = minhaProf <= q1 ? "Q1 (25% Baixo)" : minhaProf <= q2 ? "Q2 (Médio Baixo)" : minhaProf <= q3 ? "Q3 (Médio Alto)" : "Q4 (25% Topo)";
    let corRank = minhaProf > q2 ? "text-success" : "text-danger";

    cont.innerHTML = `
        <div class="col-12">
            <div class="glass-card border-top border-4 border-accent">
                <h3>Posicionamento de Mercado <small class="text-muted fs-6">(Edição ${ultimaEdicao.EDICAO})</small></h3>
                <div class="row mt-4">
                    <div class="col-md-6 border-end">
                        <p class="mb-1 text-muted">Classificação por Quartil:</p>
                        <h1 class="fw-800 ${corRank}">${rank}</h1>
                    </div>
                    <div class="col-md-6 ps-4">
                        <div class="d-flex justify-content-between mb-2"><span>Mediana do Município (Q2):</span> <b>${Math.round(q2)}</b></div>
                        <div class="d-flex justify-content-between mb-2"><span>Sua Proficiência:</span> <b>${Math.round(minhaProf)}</b></div>
                        <div class="progress mt-3" style="height: 10px;">
                            <div class="progress-bar bg-accent" style="width: ${(minhaProf/profs[profs.length-1])*100}%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>`;
}

// 6. Exportação e Utilidades
async function baixarPNG(id, nome) {
    const canvas = await html2canvas(document.getElementById(id), { scale: 3 });
    const link = document.createElement('a');
    link.download = `${nome}.png`;
    link.href = canvas.toDataURL();
    link.click();
}

async function exportarRelatorioPDF() {
    iziToast.info({ title: 'PDF', message: 'Gerando relatório de alta qualidade...' });
    const area = document.getElementById('print-zone');
    const canvas = await html2canvas(area, { scale: 2 });
    const imgData = canvas.toDataURL('image/png');
    const doc = new jspdf.jsPDF('p', 'mm', 'a4');
    
    doc.setFontSize(18);
    doc.text(`Relatório de Desempenho: ${document.getElementById('headerEscola').innerText}`, 15, 20);
    doc.addImage(imgData, 'PNG', 10, 30, 190, (canvas.height * 190) / canvas.width);
    doc.save(`SPAECE_Relatorio_${escolaAtiva}.pdf`);
}

function confirmarSair() {
    iziToast.question({
        timeout: 20000, close: false, overlay: true,
        displayMode: 'once', id: 'question', zindex: 9999,
        title: 'Nova Consulta?', message: 'Deseja limpar os dados e voltar ao login?',
        position: 'center',
        buttons: [
            ['<button><b>SIM</b></button>', function (instance, toast) {
                location.reload();
            }, true],
            ['<button>NÃO</button>', function (instance, toast) {
                instance.hide({ transitionOut: 'fadeOut' }, toast, 'button');
            }]
        ]
    });
}

window.onload = carregarBases;
</script>
</body>
</html>
