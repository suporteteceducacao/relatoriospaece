<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPAECE Analytics V11.0 | High Performance</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/css/iziToast.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/js/iziToast.min.js"></script>

    <style>
        :root {
            --primary: #0f172a; --accent: #6366f1; --bg: #f8fafc;
            --n1: #ef4444; --n2: #f97316; --n3: #fbbf24; --n4: #34d399; --n5: #059669;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #1e293b; }
        
        /* Overlay Login */
        #login-overlay {
            position: fixed; inset: 0; z-index: 9999; background: var(--primary);
            display: flex; align-items: center; justify-content: center; transition: 0.5s;
        }
        .login-card { background: white; padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; }

        /* Layout */
        #sidebar { width: 300px; height: 100vh; position: fixed; background: var(--primary); color: white; padding: 25px; }
        #content { margin-left: 300px; padding: 40px; }

        .glass-card { 
            background: white; border-radius: 20px; padding: 25px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 30px; position: relative;
        }

        .btn-dl { position: absolute; top: 15px; right: 15px; z-index: 10; font-size: 11px; }

        .nav-pills .nav-link.active { background: var(--accent); }

        /* Níveis em Cards */
        .nivel-box { padding: 10px; border-radius: 10px; color: white; text-align: center; font-size: 12px; font-weight: bold; flex: 1; margin: 2px; }
        
        /* Comparativo */
        .badge-up { background: #dcfce7; color: #166534; padding: 10px 20px; border-radius: 30px; font-weight: 800; }
        .badge-down { background: #fee2e2; color: #991b1b; padding: 10px 20px; border-radius: 30px; font-weight: 800; }

        footer { border-top: 1px solid #e2e8f0; padding: 20px; text-align: center; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-card shadow-lg">
        <h3 class="fw-800 mb-4">Acesso SPAECE</h3>
        <input type="text" id="inepInput" class="form-control mb-3" placeholder="Digite o INEP">
        <button class="btn btn-primary w-100 fw-bold" onclick="login()">Entrar</button>
    </div>
</div>

<div id="app" style="display:none;">
    <aside id="sidebar">
        <div class="text-center mb-5">
            <h4 class="fw-800 mb-0 text-accent">V11.0 PRO</h4>
            <small class="opacity-50 text-uppercase">Maracanaú Analytics</small>
        </div>
        <div class="mb-4">
            <label class="small fw-bold mb-2">ETAPA</label>
            <select id="selEtapa" class="form-select bg-dark text-white border-0" onchange="updateComp()"></select>
        </div>
        <div class="mb-4">
            <label class="small fw-bold mb-2">COMPONENTE</label>
            <select id="selComp" class="form-select bg-dark text-white border-0" onchange="render()"></select>
        </div>
        <button class="btn btn-outline-light btn-sm w-100 mt-5" onclick="location.reload()">Sair / Nova Consulta</button>
        <button class="btn btn-danger w-100 mt-2 fw-bold" onclick="pdfTotal()"><i class="fas fa-file-pdf me-2"></i>PDF GERAL</button>
    </aside>

    <main id="content">
        <div id="print-zone">
            <header class="mb-4">
                <h2 id="hEscola" class="fw-800 text-primary mb-0">---</h2>
                <p id="hInep" class="text-muted"></p>
            </header>

            <ul class="nav nav-pills mb-4">
                <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab1">Proficiência</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab2">Níveis de Desempenho</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab3">Evolução Histórica</button></li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="tab1">
                    <div class="glass-card" id="cardProf">
                        <button class="btn btn-light btn-sm btn-dl no-print" onclick="dlPng('cardProf', 'Proficiencia')">PNG</button>
                        <h5 class="fw-bold mb-4">Evolução da Proficiência Média</h5>
                        <div style="height: 400px;"><canvas id="chartProf"></canvas></div>
                    </div>
                </div>

                <div class="tab-pane fade" id="tab2">
                    <div id="niveisGrid"></div>
                </div>

                <div class="tab-pane fade" id="tab3">
                    <div id="compGrid"></div>
                </div>
            </div>
        </div>
        <footer>&copy; 2026 SME Maracanaú - Inteligência de Dados Educacionais</footer>
    </main>
</div>

<script>
let rawData = [];
let db = [];
let currentChartProf = null;

async function load() {
    try {
        const [r1, r2] = await Promise.all([
            fetch('result_spaece.json').then(r => r.json()),
            fetch('result_alfa.json').then(r => r.json())
        ]);
        db = [...r1, ...r2];
    } catch(e) { iziToast.error({title:'Erro', message:'Falha nos arquivos JSON'}); }
}

function login() {
    const inep = document.getElementById('inepInput').value;
    rawData = db.filter(d => String(d.INEP_ESC || d.INEP) === inep).sort((a,b) => a.EDICAO - b.EDICAO);
    if(rawData.length > 0) {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        init();
    } else { iziToast.warning({title:'Erro', message:'INEP não encontrado'}); }
}

function init() {
    const etapas = [...new Set(rawData.map(d => d.ETAPA))];
    document.getElementById('selEtapa').innerHTML = etapas.map(e => `<option>${e}</option>`).join('');
    updateComp();
}

function updateComp() {
    const etp = document.getElementById('selEtapa').value;
    const comps = [...new Set(rawData.filter(d => d.ETAPA === etp).map(d => d.COMPONENTE_CURRICULAR || d.DISCIPLINA))];
    document.getElementById('selComp').innerHTML = comps.map(c => `<option>${c}</option>`).join('');
    render();
}

function render() {
    const etp = document.getElementById('selEtapa').value;
    const comp = document.getElementById('selComp').value;
    const rows = rawData.filter(d => d.ETAPA === etp && (d.COMPONENTE_CURRICULAR === comp || d.DISCIPLINA === comp));

    document.getElementById('hEscola').innerText = rows[0].ESCOLA || rows[0].NO_MUNICIPIO;
    document.getElementById('hInep').innerText = `INEP: ${rows[0].INEP_ESC || rows[0].INEP} | ${etp}`;

    renderTabProf(rows);
    renderTabNiveis(rows, etp);
    renderTabComp(rows);
}

function renderTabProf(rows) {
    if(currentChartProf) currentChartProf.destroy();
    const ctx = document.getElementById('chartProf').getContext('2d');
    currentChartProf = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: rows.map(r => r.EDICAO),
            datasets: [
                {
                    label: 'Proficiência Média',
                    data: rows.map(r => Math.round(r.PROFICIENCIA_MEDIA)),
                    backgroundColor: 'rgba(99, 102, 241, 0.2)',
                    borderColor: '#6366f1',
                    borderWidth: 2,
                    type: 'line',
                    tension: 0.4,
                    fill: true
                },
                {
                    label: 'Pontos por Edição',
                    data: rows.map(r => Math.round(r.PROFICIENCIA_MEDIA)),
                    backgroundColor: '#6366f1',
                    borderRadius: 10
                }
            ]
        },
        options: { 
            maintainAspectRatio: false,
            plugins: { datalabels: { anchor: 'end', align: 'top', font: {weight: 'bold'} } },
            scales: { y: { beginAtZero: false } }
        }
    });
}

function renderTabNiveis(rows, etp) {
    const cont = document.getElementById('niveisGrid');
    cont.innerHTML = '';
    
    rows.forEach((row, i) => {
        const id = `chart-n-${i}`;
        const cardId = `card-n-${i}`;
        const isAlfa = etp.includes('2º');
        
        let labels = isAlfa ? ['Não Alfab.', 'Incompl.', 'Interm.', 'Sufic.', 'Desej.'] : ['M. Crítico', 'Crítico', 'Interm.', 'Adequado'];
        let data = isAlfa ? 
            [row.NAO_ALFABETIZADOS, row.ALFABETIZACAO_INCOMPLETA, row.INTERMEDIARIO, row.SUFICIENTE, row.DESEJAVEL] :
            [row.MUITO_CRITICO, row.CRITICO, row.INTERMEDIARIO, row.ADEQUADO];
        let cores = ['#ef4444', '#f97316', '#fbbf24', '#34d399', '#059669'];

        let cardsHtml = data.map((v, idx) => `
            <div class="nivel-box" style="background:${cores[idx]}">
                ${labels[idx]}<br><span class="fs-5">${Math.round(v)}%</span>
            </div>
        `).join('');

        cont.innerHTML += `
            <div class="glass-card" id="${cardId}">
                <button class="btn btn-light btn-sm btn-dl no-print" onclick="dlPng('${cardId}', 'Niveis_${row.EDICAO}')">PNG</button>
                <h5 class="fw-bold mb-3">Distribuição de Níveis - Edição ${row.EDICAO}</h5>
                <div class="d-flex mb-4">${cardsHtml}</div>
                <div style="height: 120px;"><canvas id="${id}"></canvas></div>
            </div>`;

        setTimeout(() => {
            new Chart(document.getElementById(id), {
                type: 'bar',
                data: {
                    labels: [''],
                    datasets: data.map((v, idx) => ({
                        label: labels[idx],
                        data: [Math.round(v)],
                        backgroundColor: cores[idx]
                    }))
                },
                options: {
                    indexAxis: 'y',
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false }, datalabels: { color: '#fff', font: {weight:'bold'} } },
                    scales: { x: { stacked: true, display: false }, y: { stacked: true, display: false } }
                }
            });
        }, 100);
    });
}

function renderTabComp(rows) {
    const cont = document.getElementById('compGrid');
    cont.innerHTML = '';
    
    for(let i = 1; i < rows.length; i++) {
        const at = rows[i], an = rows[i-1];
        const diff = Math.round(at.PROFICIENCIA_MEDIA - an.PROFICIENCIA_MEDIA);
        const cor = diff >= 0 ? 'badge-up' : 'badge-down';
        const icon = diff >= 0 ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down';

        cont.innerHTML += `
            <div class="glass-card animate__animated animate__fadeIn">
                <div class="row align-items-center">
                    <div class="col-md-4 text-center border-end">
                        <small class="text-muted fw-bold">COMPARAÇÃO</small>
                        <h4 class="fw-800">${an.EDICAO} <i class="fas fa-arrow-right mx-2 text-muted"></i> ${at.EDICAO}</h4>
                    </div>
                    <div class="col-md-4 text-center border-end">
                        <div class="${cor} d-inline-block">
                            <i class="fas ${icon} me-2"></i> ${diff > 0 ? '+' : ''}${diff} PONTOS
                        </div>
                    </div>
                    <div class="col-md-4 text-center">
                        <small class="text-muted d-block">STATUS</small>
                        <span class="fw-800 fs-5">${diff >= 0 ? 'CRESCIMENTO' : 'QUEDA'}</span>
                    </div>
                </div>
            </div>`;
    }
}

async function dlPng(id, nome) {
    const canvas = await html2canvas(document.getElementById(id), { scale: 2 });
    const link = document.createElement('a');
    link.download = `${nome}.png`;
    link.href = canvas.toDataURL();
    link.click();
}

async function pdfTotal() {
    iziToast.info({title:'PDF', message:'Gerando relatório completo...'});
    const canvas = await html2canvas(document.getElementById('print-zone'), { scale: 2 });
    const doc = new jspdf.jsPDF('p', 'mm', 'a4');
    doc.addImage(canvas.toDataURL('image/png'), 'PNG', 10, 10, 190, (canvas.height * 190) / canvas.width);
    doc.save('Relatorio_SPAECE_V11.pdf');
}

window.onload = load;
</script>
</body>
</html>
