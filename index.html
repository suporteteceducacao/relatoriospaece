<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPAECE Analytics Pro V12.0</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/css/iziToast.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/js/iziToast.min.js"></script>

    <style>
        :root {
            --primary: #0f172a; --accent: #4f46e5;
            --c-red: #ef4444; --c-orange: #f97316; --c-yellow: #facc15; 
            --c-green-l: #4ade80; --c-green-d: #166534;
        }

        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; color: #1e293b; }

        /* TELA DE ABERTURA - FOCO NO LOGIN */
        #login-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: #e2e8f0; /* Fundo mais escuro para focar no card */
            display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: #ffffff; border-radius: 24px; width: 100%; max-width: 420px; 
            padding: 45px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
        }

        #sidebar { width: 300px; height: 100vh; position: fixed; background: var(--primary); color: white; padding: 30px; z-index: 100; }
        #content { margin-left: 300px; padding: 40px; min-height: 100vh; }

        .glass-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; position: relative; border: 1px solid #edf2f7; }
        
        /* ABAS */
        .nav-pills .nav-link { color: #64748b; font-weight: 700; border-radius: 12px; padding: 10px 18px; margin-right: 5px; }
        .nav-pills .nav-link.active { background: var(--accent); color: white; }

        /* EVOLUÇÃO HISTÓRICA */
        .evolution-row { background: #ffffff; border-left: 6px solid #cbd5e1; transition: 0.3s; }
        .evo-up { border-left-color: #22c55e; background: #f0fdf4; }
        .evo-down { border-left-color: #ef4444; background: #fef2f2; }
        .evo-icon { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }

        .btn-dl { position: absolute; top: 15px; right: 15px; font-size: 10px; font-weight: bold; z-index: 5; }
        
        @media print { .no-print { display: none; } #content { margin-left: 0; padding: 0; } }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-card animate__animated animate__fadeInDown">
        <div class="mb-4 text-primary"><i class="fas fa-fingerprint fa-4x mb-3"></i></div>
        <h3 class="fw-800 mb-1">Portal SPAECE</h3>
        <p class="text-muted small mb-4">Insira o INEP da unidade escolar</p>
        <input type="text" id="inepInput" class="form-control form-control-lg text-center mb-3 shadow-sm" placeholder="Código INEP">
        <button class="btn btn-primary btn-lg w-100 fw-bold rounded-3" onclick="entrar()">ENTRAR NO PAINEL</button>
    </div>
</div>

<div id="app" style="display:none;">
    <aside id="sidebar">
        <div class="mb-5 text-center">
            <h4 class="fw-800 text-white mb-0">ANALYTICS</h4>
            <span class="badge bg-primary">V12.0 ENTERPRISE</span>
        </div>
        <div class="mb-4">
            <label class="small fw-bold text-white-50">ETAPA (ORDEM CRESC.)</label>
            <select id="selEtapa" class="form-select bg-dark text-white border-0 mt-2" onchange="popularComponentes()"></select>
        </div>
        <div class="mb-4">
            <label class="small fw-bold text-white-50">COMPONENTE</label>
            <select id="selComp" class="form-select bg-dark text-white border-0 mt-2" onchange="render()"></select>
        </div>
        <hr class="opacity-25 my-5">
        <button class="btn btn-outline-light w-100 mb-2 btn-sm" onclick="location.reload()">NOVA CONSULTA</button>
        <button class="btn btn-success w-100 fw-bold shadow" onclick="gerarPDF()">BAIXAR RELATÓRIO PDF</button>
    </aside>

    <main id="content">
        <header class="mb-4 d-flex justify-content-between align-items-end">
            <div>
                <h2 id="hEscola" class="fw-800 text-primary mb-0">---</h2>
                <span id="hInep" class="text-muted fw-bold">INEP: ---</span>
            </div>
            <div class="text-end no-print">
                <i class="fas fa-university fa-2x text-light"></i>
            </div>
        </header>

        <ul class="nav nav-pills mb-4 no-print" id="pills-tab">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-prof">PROFICIÊNCIA</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-ide">INDICADOR IDE</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-niveis">NÍVEIS (100%)</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-hist">EVOLUÇÃO HISTÓRICA</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="tab-prof">
                <div class="glass-card" id="card-prof">
                    <button class="btn btn-light shadow-sm btn-dl" onclick="baixarPNG('card-prof', 'Proficiencia')"><i class="fas fa-camera me-1"></i>PNG</button>
                    <h5 class="fw-bold mb-4 text-secondary"><i class="fas fa-chart-bar me-2"></i>Evolução da Proficiência</h5>
                    <div style="height:400px"><canvas id="chartProf"></canvas></div>
                </div>
            </div>

            <div class="tab-pane fade" id="tab-ide">
                <div class="glass-card" id="card-ide">
                    <button class="btn btn-light shadow-sm btn-dl" onclick="baixarPNG('card-ide', 'Indicador_IDE')"><i class="fas fa-camera me-1"></i>PNG</button>
                    <h5 id="titleIde" class="fw-bold mb-4 text-secondary"><i class="fas fa-chart-line me-2"></i>IDE</h5>
                    <div style="height:400px"><canvas id="chartIde"></canvas></div>
                </div>
            </div>

            <div class="tab-pane fade" id="tab-niveis">
                <div id="gridNiveis"></div>
            </div>

            <div class="tab-pane fade" id="tab-hist">
                <div id="gridHistorico"></div>
            </div>
        </div>
    </main>
</div>

<script>
let db = [];
let chartP = null; let chartI = null;
Chart.register(ChartDataLabels);

async function load() {
    try {
        const [rS, rA] = await Promise.all([
            fetch('result_spaece.json').then(r => r.json()),
            fetch('result_alfa.json').then(r => r.json())
        ]);
        db = [...rS, ...rA];
    } catch(e) { console.error("Erro JSON"); }
}

function entrar() {
    const inep = document.getElementById('inepInput').value;
    const find = db.find(d => String(d.INEP_ESC || d.INEP) === inep);
    if(find) {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        
        const etapas = [...new Set(db.filter(d => String(d.INEP_ESC || d.INEP) === inep).map(d => d.ETAPA))].sort((a,b) => parseInt(a) - parseInt(b));
        document.getElementById('selEtapa').innerHTML = etapas.map(e => `<option>${e}</option>`).join('');
        popularComponentes();
    } else { iziToast.error({title:'Erro', message:'INEP não encontrado!'}); }
}

function popularComponentes() {
    const inep = document.getElementById('inepInput').value;
    const etapa = document.getElementById('selEtapa').value;
    const comps = [...new Set(db.filter(d => String(d.INEP_ESC || d.INEP) === inep && d.ETAPA === etapa).map(d => d.COMPONENTE_CURRICULAR || d.DISCIPLINA))].sort((a,b) => b.localeCompare(a));
    document.getElementById('selComp').innerHTML = comps.map(c => `<option>${c}</option>`).join('');
    render();
}

function parseV(v) { 
    if(!v) return 0;
    return parseFloat(String(v).replace('%','').replace(',','.')) || 0; 
}

function render() {
    const inep = document.getElementById('inepInput').value;
    const etapa = document.getElementById('selEtapa').value;
    const comp = document.getElementById('selComp').value;
    const rows = db.filter(d => String(d.INEP_ESC || d.INEP) === inep && d.ETAPA === etapa && (d.COMPONENTE_CURRICULAR === comp || d.DISCIPLINA === comp)).sort((a,b) => a.EDICAO - b.EDICAO);

    document.getElementById('hEscola').innerText = rows[0].ESCOLA || rows[0].NO_MUNICIPIO;
    document.getElementById('hInep').innerText = `INEP: ${inep} | ${etapa}`;

    const rowsDesc = [...rows].reverse();

    renderProf(rows);
    renderIde(rows, etapa, comp);
    renderNiveis(rowsDesc, etapa);
    renderHistorico(rowsDesc);
}

function renderProf(rows) {
    if(chartP) chartP.destroy();
    chartP = new Chart(document.getElementById('chartProf'), {
        type: 'bar',
        data: {
            labels: rows.map(r => r.EDICAO),
            datasets: [{ data: rows.map(r => Math.round(parseV(r.PROFICIENCIA_MEDIA))), backgroundColor: '#4f46e5', borderRadius: 8 }]
        },
        options: { maintainAspectRatio: false, plugins: { legend: {display:false}, datalabels: { anchor:'end', align:'top', font:{weight:'bold'} } } }
    });
}

function renderIde(rows, etapa, comp) {
    if(chartI) chartI.destroy();
    let label = etapa.includes('2º') ? 'IDE Alfa' : (comp.includes('Port') ? 'IDE LP' : 'IDE MT');
    document.getElementById('titleIde').innerText = `Gráfico de Desempenho: ${label}`;

    chartI = new Chart(document.getElementById('chartIde'), {
        type: 'line',
        data: {
            labels: rows.map(r => r.EDICAO),
            datasets: [{
                label: label,
                data: rows.map(r => parseV(r.IDE_ALFA || r.IDE_LP || r.IDE_MT || r.IDE || 0)),
                borderColor: '#10b981', pointBackgroundColor: '#10b981', tension: 0.3, fill: false, pointRadius: 5
            }]
        },
        options: { 
            maintainAspectRatio: false, 
            plugins: { datalabels: { anchor:'end', align:'top', font:{weight:'bold'}, formatter: v => v.toFixed(2) } } 
        }
    });
}

function renderNiveis(rows, etapa) {
    const cont = document.getElementById('gridNiveis'); cont.innerHTML = '';
    const isA = etapa.includes('2º');
    rows.forEach((row, i) => {
        const id = `cn-${i}`; const cid = `card-nv-${i}`;
        let l, v, c;
        if(isA) {
            l = ['Não Alfab.', 'Incompleta', 'Intermediário', 'Suficiente', 'Desejável'];
            v = [parseV(row.NAO_ALFABETIZADOS), parseV(row.ALFABETIZACAO_INCOMPLETA), parseV(row.INTERMEDIARIO), parseV(row.SUFICIENTE), parseV(row.DESEJAVEL)];
            c = ['#ef4444', '#f97316', '#facc15', '#4ade80', '#166534'];
        } else {
            l = ['Muito Crítico', 'Crítico', 'Intermediário', 'Adequado'];
            v = [parseV(row.MUITO_CRITICO), parseV(row.CRITICO), parseV(row.INTERMEDIARIO), parseV(row.ADEQUADO)];
            c = ['#ef4444', '#facc15', '#4ade80', '#166534'];
        }
        cont.innerHTML += `<div class="glass-card" id="${cid}"><button class="btn btn-light shadow-sm btn-dl" onclick="baixarPNG('${cid}', 'Nivel_${row.EDICAO}')"><i class="fas fa-camera"></i></button><h6 class="fw-bold mb-3">Edição ${row.EDICAO} (Acumulado 100%)</h6><div style="height:110px"><canvas id="${id}"></canvas></div></div>`;
        setTimeout(() => {
            new Chart(document.getElementById(id), {
                type: 'bar', data: { labels: [''], datasets: l.map((lab, idx) => ({ label: lab, data: [Math.round(v[idx])], backgroundColor: c[idx] })) },
                options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend:{position:'bottom', labels:{boxWidth:12}}, datalabels: { color: '#000', font:{weight:'bold'}, formatter: val => val > 0 ? val+'%' : '' } }, scales: { x:{stacked:true, display:false, max:100}, y:{stacked:true, display:false} } }
            });
        }, 150);
    });
}

function renderHistorico(rows) {
    const cont = document.getElementById('gridHistorico');
    cont.innerHTML = '<h5 class="fw-bold mb-4 text-secondary"><i class="fas fa-history me-2"></i>Comparativo de Edições (Recente para Antigo)</h5>';
    for(let i = 0; i < rows.length - 1; i++) {
        const vAtu = Math.round(parseV(rows[i].PROFICIENCIA_MEDIA));
        const vAnt = Math.round(parseV(rows[i+1].PROFICIENCIA_MEDIA));
        const diff = vAtu - vAnt;
        const trend = diff > 0 ? 'evo-up' : diff < 0 ? 'evo-down' : '';
        const icon = diff > 0 ? 'fa-arrow-up' : diff < 0 ? 'fa-arrow-down' : 'fa-equals';
        const color = diff > 0 ? 'text-success' : diff < 0 ? 'text-danger' : 'text-muted';

        cont.innerHTML += `
            <div class="glass-card evolution-row ${trend} p-4 shadow-sm animate__animated animate__fadeInLeft">
                <div class="row align-items-center">
                    <div class="col-md-3 text-center border-end">
                        <small class="text-muted d-block fw-bold">EDIÇÕES</small>
                        <h5 class="fw-800 mb-0">${rows[i+1].EDICAO} <i class="fas fa-long-arrow-alt-right mx-2 opacity-50"></i> ${rows[i].EDICAO}</h5>
                    </div>
                    <div class="col-md-4 text-center border-end">
                        <small class="text-muted d-block fw-bold">DIFERENÇA</small>
                        <h3 class="fw-900 ${color} mb-0">${diff > 0 ? '+' : ''}${diff} <small class="fs-6">pontos</small></h3>
                    </div>
                    <div class="col-md-5 d-flex align-items-center justify-content-center">
                        <div class="evo-icon ${trend} me-3 shadow-sm"><i class="fas ${icon}"></i></div>
                        <h5 class="fw-800 mb-0 ${color}">${diff > 0 ? 'CRESCIMENTO' : diff < 0 ? 'QUEDA' : 'ESTAGNAÇÃO'}</h5>
                    </div>
                </div>
            </div>`;
    }
}

async function baixarPNG(id, n) {
    const c = await html2canvas(document.getElementById(id), { scale: 2 });
    const l = document.createElement('a'); l.download = `${n}.png`; l.href = c.toDataURL(); l.click();
}

async function gerarPDF() {
    iziToast.info({title:'Processando', message: 'Gerando PDF de alta qualidade...'});
    const c = await html2canvas(document.getElementById('content'), { scale: 2 });
    const d = new jspdf.jsPDF('p', 'mm', 'a4');
    d.addImage(c.toDataURL('image/png'), 'PNG', 10, 10, 190, (c.height * 190) / c.width);
    d.save('Relatorio_Completo_SPAECE.pdf');
}

window.onload = load;
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
