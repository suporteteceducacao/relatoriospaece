<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPAECE Analytics Pro V11.0</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/css/iziToast.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/js/iziToast.min.js"></script>

    <style>
        :root {
            --primary: #0f172a; --accent: #4f46e5;
            --c-vermelho: #ef4444; --c-laranja: #f97316; --c-amarelo: #facc15; 
            --c-verdelight: #4ade80; --c-verdedark: #166534;
        }

        /* Tela de Abertura Elegante */
        #login-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 50px;
            border-radius: 30px; width: 100%; max-width: 450px; text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .login-card h2 { color: #fff; font-weight: 800; letter-spacing: -1px; }
        .login-card p { color: #94a3b8; }

        /* Dashboard Layout */
        body { background-color: #f1f5f9; font-family: 'Inter', sans-serif; }
        #sidebar { width: 300px; height: 100vh; position: fixed; background: var(--primary); color: white; padding: 30px; }
        #content { margin-left: 300px; padding: 40px; transition: 0.3s; }

        .glass-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); margin-bottom: 30px; position: relative; }
        
        /* Badges de Histórico */
        .status-up { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .status-down { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
        .status-equal { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }

        .nivel-label { font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
        .btn-png { position: absolute; top: 15px; right: 15px; font-size: 10px; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-card animate__animated animate__fadeIn">
        <div class="mb-4">
            <i class="fas fa-shield-halved fa-4x text-accent mb-3"></i>
            <h2>SPAECE <span class="text-accent">PRO</span></h2>
            <p>SME Maracanaú - Inteligência Educacional</p>
        </div>
        <div class="form-group mb-4">
            <input type="text" id="inepInput" class="form-control form-control-lg bg-dark text-white border-0 text-center" placeholder="Código INEP">
        </div>
        <button class="btn btn-accent btn-lg w-100 fw-bold shadow-lg" onclick="entrar()">
            ACESSAR PAINEL
        </button>
    </div>
</div>

<div id="app" style="display:none;">
    <aside id="sidebar">
        <div class="mb-5">
            <h5 class="fw-bold mb-0">Analytics V11.0</h5>
            <div class="badge bg-accent">Enterprise Edition</div>
        </div>
        <div class="mb-4">
            <label class="small fw-bold text-white-50">ETAPA DE ENSINO</label>
            <select id="selEtapa" class="form-select bg-dark text-white border-0 mt-2" onchange="popularComponentes()"></select>
        </div>
        <div class="mb-4">
            <label class="small fw-bold text-white-50">COMPONENTE</label>
            <select id="selComp" class="form-select bg-dark text-white border-0 mt-2" onchange="render()"></select>
        </div>
        <hr class="opacity-25 my-5">
        <button class="btn btn-danger w-100" onclick="location.reload()">NOVA CONSULTA</button>
    </aside>

    <main id="content">
        <header class="mb-5 d-flex justify-content-between align-items-center">
            <div>
                <h2 id="hEscola" class="fw-800 text-primary mb-1">---</h2>
                <span id="hInep" class="badge bg-secondary p-2">INEP: ---</span>
            </div>
            <button class="btn btn-success fw-bold" onclick="gerarPDF()">
                <i class="fas fa-file-pdf me-2"></i>BAIXAR PDF COMPLETO
            </button>
        </header>

        <ul class="nav nav-pills mb-4 no-print" id="tabs">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-prof">PROFICIÊNCIA</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-niveis">NÍVEIS (100%)</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-hist">EVOLUÇÃO HISTÓRICA</button></li>
        </ul>

        <div id="print-area">
            <div class="tab-content">
                <div class="tab-pane fade show active" id="tab-prof">
                    <div class="glass-card">
                        <h5 class="fw-bold mb-4">Série Histórica de Proficiência</h5>
                        <div style="height:400px"><canvas id="chartProf"></canvas></div>
                    </div>
                </div>

                <div class="tab-pane fade" id="tab-niveis">
                    <div id="gridNiveis"></div>
                </div>

                <div class="tab-pane fade" id="tab-hist">
                    <div id="gridHistorico"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
let database = [];
let chartInstance = null;

// Carregar Dados
async function load() {
    try {
        const [rS, rA] = await Promise.all([
            fetch('result_spaece.json').then(r => r.json()),
            fetch('result_alfa.json').then(r => r.json())
        ]);
        database = [...rS, ...rA];
    } catch(e) { iziToast.error({title:'Erro', message:'Falha ao carregar JSON.'}); }
}

function entrar() {
    const inep = document.getElementById('inepInput').value;
    const find = database.find(d => String(d.INEP_ESC || d.INEP) === inep);
    if(find) {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        const etapas = [...new Set(database.filter(d => String(d.INEP_ESC || d.INEP) === inep).map(d => d.ETAPA))];
        document.getElementById('selEtapa').innerHTML = etapas.map(e => `<option>${e}</option>`).join('');
        popularComponentes();
    } else { iziToast.warning({title:'Aviso', message:'INEP não localizado.'}); }
}

function popularComponentes() {
    const inep = document.getElementById('inepInput').value;
    const etapa = document.getElementById('selEtapa').value;
    const comps = [...new Set(database.filter(d => String(d.INEP_ESC || d.INEP) === inep && d.ETAPA === etapa).map(d => d.COMPONENTE_CURRICULAR || d.DISCIPLINA))];
    document.getElementById('selComp').innerHTML = comps.map(c => `<option>${c}</option>`).join('');
    render();
}

// Tratamento Numérico (Crucial para o JSON original)
function parseVal(v) {
    if(!v) return 0;
    return Math.round(parseFloat(String(v).replace('%', '').replace(',', '.')) || 0);
}

function render() {
    const inep = document.getElementById('inepInput').value;
    const etapa = document.getElementById('selEtapa').value;
    const comp = document.getElementById('selComp').value;
    const rows = database.filter(d => String(d.INEP_ESC || d.INEP) === inep && d.ETAPA === etapa && (d.COMPONENTE_CURRICULAR === comp || d.DISCIPLINA === comp))
                         .sort((a,b) => a.EDICAO - b.EDICAO);

    document.getElementById('hEscola').innerText = rows[0].ESCOLA || rows[0].NO_MUNICIPIO;
    document.getElementById('hInep').innerText = `INEP: ${inep} | ${etapa}`;

    renderProf(rows);
    renderNiveis(rows, etapa);
    renderHistorico(rows);
}

function renderProf(rows) {
    if(chartInstance) chartInstance.destroy();
    const ctx = document.getElementById('chartProf').getContext('2d');
    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: rows.map(r => r.EDICAO),
            datasets: [{
                label: 'Proficiência Média',
                data: rows.map(r => parseVal(r.PROFICIENCIA_MEDIA)),
                backgroundColor: '#4f46e5',
                borderRadius: 8
            }]
        },
        options: {
            maintainAspectRatio: false,
            plugins: { datalabels: { anchor: 'end', align: 'top', font: {weight:'bold'} } }
        }
    });
}

function renderNiveis(rows, etapa) {
    const cont = document.getElementById('gridNiveis');
    cont.innerHTML = '';
    const isAlfa = etapa.includes('2º');

    rows.forEach((row, i) => {
        const cardId = `card-nivel-${i}`;
        const canvasId = `cn-${i}`;
        
        let labels, values, cores;
        if(isAlfa) {
            labels = ['Não Alfab.', 'Incompl.', 'Interm.', 'Sufic.', 'Desej.'];
            values = [parseVal(row.NAO_ALFABETIZADOS), parseVal(row.ALFABETIZACAO_INCOMPLETA), parseVal(row.INTERMEDIARIO), parseVal(row.SUFICIENTE), parseVal(row.DESEJAVEL)];
            cores = ['#ef4444', '#f97316', '#facc15', '#4ade80', '#166534'];
        } else {
            labels = ['M. Crítico', 'Crítico', 'Interm.', 'Adequado'];
            values = [parseVal(row.MUITO_CRITICO), parseVal(row.CRITICO), parseVal(row.INTERMEDIARIO), parseVal(row.ADEQUADO)];
            cores = ['#ef4444', '#facc15', '#4ade80', '#166534'];
        }

        cont.innerHTML += `
            <div class="glass-card" id="${cardId}">
                <button class="btn btn-light btn-sm btn-png no-print" onclick="baixarPNG('${cardId}', 'Nivel_${row.EDICAO}')">PNG</button>
                <h6 class="fw-bold mb-3">Edição ${row.EDICAO} - Distribuição Acumulada (%)</h6>
                <div style="height: 100px;"><canvas id="${canvasId}"></canvas></div>
            </div>`;

        setTimeout(() => {
            new Chart(document.getElementById(canvasId), {
                type: 'bar',
                data: {
                    labels: [''],
                    datasets: labels.map((l, idx) => ({
                        label: l,
                        data: [values[idx]],
                        backgroundColor: cores[idx],
                        barThickness: 50
                    }))
                },
                options: {
                    indexAxis: 'y',
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { position: 'bottom', labels: { boxWidth: 12, font: {size: 10} } },
                        datalabels: { color: '#000', font: {weight:'bold'}, formatter: v => v > 0 ? v+'%' : '' }
                    },
                    scales: { 
                        x: { stacked: true, display: false, max: 100 }, 
                        y: { stacked: true, display: false } 
                    }
                }
            });
        }, 100);
    });
}

function renderHistorico(rows) {
    const cont = document.getElementById('gridHistorico');
    cont.innerHTML = '<h5 class="fw-bold mb-4">Comparativo Evolutivo entre Edições</h5>';
    
    for(let i = 1; i < rows.length; i++) {
        const atual = parseVal(rows[i].PROFICIENCIA_MEDIA);
        const anterior = parseVal(rows[i-1].PROFICIENCIA_MEDIA);
        const diff = atual - anterior;
        
        let statusClass = diff > 0 ? 'status-up' : diff < 0 ? 'status-down' : 'status-equal';
        let statusTxt = diff > 0 ? 'CRESCIMENTO' : diff < 0 ? 'QUEDA' : 'ESTAGNAÇÃO';
        let icon = diff > 0 ? 'fa-arrow-up' : diff < 0 ? 'fa-arrow-down' : 'fa-equals';

        cont.innerHTML += `
            <div class="glass-card p-4 animate__animated animate__fadeIn">
                <div class="row align-items-center">
                    <div class="col-md-3">
                        <small class="text-muted d-block">PERÍODO</small>
                        <span class="fw-bold">${rows[i-1].EDICAO} <i class="fas fa-long-arrow-right mx-2 text-muted"></i> ${rows[i].EDICAO}</span>
                    </div>
                    <div class="col-md-3 text-center">
                        <small class="text-muted d-block">VARIAÇÃO</small>
                        <span class="fs-4 fw-800">${diff > 0 ? '+' : ''}${diff} pts</span>
                    </div>
                    <div class="col-md-6 text-end">
                        <div class="d-inline-flex align-items-center ${statusClass} p-3 rounded-pill fw-800">
                            <i class="fas ${icon} me-2"></i> ${statusTxt}
                        </div>
                    </div>
                </div>
            </div>`;
    }
}

async function baixarPNG(id, nome) {
    const canvas = await html2canvas(document.getElementById(id), { scale: 2 });
    const link = document.createElement('a');
    link.download = `${nome}.png`;
    link.href = canvas.toDataURL();
    link.click();
}

async function gerarPDF() {
    const canvas = await html2canvas(document.getElementById('print-area'), { scale: 2 });
    const doc = new jspdf.jsPDF('p', 'mm', 'a4');
    doc.addImage(canvas.toDataURL('image/png'), 'PNG', 10, 10, 190, (canvas.height * 190) / canvas.width);
    doc.save('Relatorio_SPAECE.pdf');
}

window.onload = load;
</script>
</body>
</html>
