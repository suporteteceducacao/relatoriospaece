<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPAECE Analytics Pro V12.5</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/css/iziToast.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/js/iziToast.min.js"></script>

    <style>
        :root {
            --primary: #0f172a; --accent: #4f46e5;
            --sidebar-width: 300px;
        }

        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; overflow-x: hidden; }

        /* TELA DE ABERTURA */
        #login-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: #e2e8f0; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: #ffffff; border-radius: 24px; width: 420px; padding: 45px; text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
        }

        /* SIDEBAR RETRÁTIL */
        #sidebar { 
            width: var(--sidebar-width); height: 100vh; position: fixed; 
            background: var(--primary); color: white; padding: 20px; 
            transition: all 0.3s ease; z-index: 1000; left: 0;
        }
        #sidebar.collapsed { left: calc(var(--sidebar-width) * -1); }

        #content { 
            margin-left: var(--sidebar-width); padding: 40px; 
            transition: all 0.3s ease; min-height: 100vh; position: relative;
            padding-bottom: 80px; /* Espaço para o rodapé */
        }
        #content.expanded { margin-left: 0; }

        /* MENU HAMBÚRGUER */
        .toggle-btn {
            position: fixed; left: 20px; top: 20px; z-index: 1001;
            background: var(--primary); color: white; border: none;
            padding: 10px 15px; border-radius: 8px; cursor: pointer; display: none;
        }
        #app:not([style*="display:none"]) .toggle-btn { display: block; }

        .glass-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; position: relative; border: 1px solid #edf2f7; }
        
        /* RODAPÉ EM TODAS AS ABAS */
        .footer-app {
            position: absolute; bottom: 0; left: 0; width: 100%;
            height: 60px; display: flex; align-items: center; justify-content: center;
            background: #f1f5f9; border-top: 1px solid #e2e8f0; color: #64748b; font-size: 0.85rem;
        }

        /* EVOLUÇÃO HISTÓRICA */
        .evolution-row { border-left: 6px solid #cbd5e1; transition: 0.3s; }
        .evo-up { border-left-color: #22c55e; background: #f0fdf4; }
        .evo-down { border-left-color: #ef4444; background: #fef2f2; }

        .btn-dl { position: absolute; top: 15px; right: 15px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-card">
        <h3 class="fw-800 mb-4">Portal SPAECE</h3>
        <input type="text" id="inepInput" class="form-control form-control-lg text-center mb-3" placeholder="Código INEP">
        <button class="btn btn-primary btn-lg w-100 fw-bold" onclick="entrar()">ENTRAR</button>
    </div>
</div>

<div id="app" style="display:none;">
    <button class="toggle-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>

    <aside id="sidebar">
        <div class="mt-5 text-center">
            <h4 class="fw-800 text-white">ANALYTICS</h4>
            <span class="badge bg-primary mb-5">V12.5 PRO</span>
        </div>
        <div class="mb-4">
            <label class="small fw-bold text-white-50">ETAPA</label>
            <select id="selEtapa" class="form-select bg-dark text-white border-0" onchange="popularComponentes()"></select>
        </div>
        <div class="mb-4">
            <label class="small fw-bold text-white-50">COMPONENTE</label>
            <select id="selComp" class="form-select bg-dark text-white border-0" onchange="render()"></select>
        </div>
        <button class="btn btn-success w-100 fw-bold mt-5" onclick="gerarPDF()">BAIXAR PDF</button>
    </aside>

    <main id="content">
        <header class="mb-4 pt-2">
            <h2 id="hEscola" class="fw-800 text-primary mb-0">---</h2>
            <span id="hInep" class="text-muted fw-bold">INEP: ---</span>
        </header>

        <ul class="nav nav-pills mb-4" id="pills-tab">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-prof">PROFICIÊNCIA</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-ide">INDICADOR IDE</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-niveis">NÍVEIS (100%)</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-hist">EVOLUÇÃO HISTÓRICA</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="tab-prof">
                <div class="glass-card" id="card-prof">
                    <button class="btn btn-light shadow-sm btn-dl" onclick="baixarPNG('card-prof', 'Proficiencia')">PNG</button>
                    <h5 class="fw-bold mb-4 text-secondary">Evolução da Proficiência</h5>
                    <div style="height:400px"><canvas id="chartProf"></canvas></div>
                </div>
            </div>

            <div class="tab-pane fade" id="tab-ide">
                <div class="glass-card" id="card-ide">
                    <button class="btn btn-light shadow-sm btn-dl" onclick="baixarPNG('card-ide', 'IDE')">PNG</button>
                    <h5 id="titleIde" class="fw-bold mb-4 text-secondary">IDE</h5>
                    <div style="height:400px"><canvas id="chartIde"></canvas></div>
                </div>
            </div>

            <div class="tab-pane fade" id="tab-niveis"><div id="gridNiveis"></div></div>
            <div class="tab-pane fade" id="tab-hist"><div id="gridHistorico"></div></div>
        </div>

        <div class="footer-app">
            <p class="mb-0">© 2024-2026 SME Maracanaú - Inteligência de Dados | Todos os direitos reservados.</p>
        </div>
    </main>
</div>

<script>
let db = [];
let chartP = null; let chartI = null;
Chart.register(ChartDataLabels);

async function load() {
    try {
        const [rS, rA] = await Promise.all([
            fetch('result_spaece.json').then(r => r.json()),
            fetch('result_alfa.json').then(r => r.json())
        ]);
        db = [...rS, ...rA];
    } catch(e) { console.error("Falha no carregamento dos dados."); }
}

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('collapsed');
    document.getElementById('content').classList.toggle('expanded');
}

function entrar() {
    const inep = document.getElementById('inepInput').value;
    if(db.some(d => String(d.INEP_ESC || d.INEP) === inep)) {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        const etapas = [...new Set(db.filter(d => String(d.INEP_ESC || d.INEP) === inep).map(d => d.ETAPA))].sort((a,b) => parseInt(a) - parseInt(b));
        document.getElementById('selEtapa').innerHTML = etapas.map(e => `<option>${e}</option>`).join('');
        popularComponentes();
    } else { iziToast.error({title:'Erro', message:'INEP não encontrado!'}); }
}

function popularComponentes() {
    const inep = document.getElementById('inepInput').value;
    const etapa = document.getElementById('selEtapa').value;
    const comps = [...new Set(db.filter(d => String(d.INEP_ESC || d.INEP) === inep && d.ETAPA === etapa).map(d => d.COMPONENTE_CURRICULAR || d.DISCIPLINA))].sort((a,b) => b.localeCompare(a));
    document.getElementById('selComp').innerHTML = comps.map(c => `<option>${c}</option>`).join('');
    render();
}

function parseV(v) { 
    if(!v || v === "null") return 0;
    return parseFloat(String(v).replace('%','').replace(',','.')) || 0; 
}

function render() {
    const inep = document.getElementById('inepInput').value;
    const etapa = document.getElementById('selEtapa').value;
    const comp = document.getElementById('selComp').value;
    const rows = db.filter(d => String(d.INEP_ESC || d.INEP) === inep && d.ETAPA === etapa && (d.COMPONENTE_CURRICULAR === comp || d.DISCIPLINA === comp)).sort((a,b) => a.EDICAO - b.EDICAO);

    document.getElementById('hEscola').innerText = rows[0].ESCOLA || rows[0].NO_MUNICIPIO;
    document.getElementById('hInep').innerText = `INEP: ${inep} | ${etapa}`;

    renderProf(rows);
    renderIde(rows, etapa, comp);
    renderNiveis([...rows].reverse(), etapa);
    renderHistorico([...rows].reverse());
}

function renderProf(rows) {
    if(chartP) chartP.destroy();
    chartP = new Chart(document.getElementById('chartProf'), {
        type: 'bar',
        data: { labels: rows.map(r => r.EDICAO), datasets: [{ data: rows.map(r => Math.round(parseV(r.PROFICIENCIA_MEDIA))), backgroundColor: '#4f46e5', borderRadius: 8 }] },
        options: { maintainAspectRatio: false, plugins: { legend: {display:false}, datalabels: { anchor:'end', align:'top', font:{weight:'bold'} } } }
    });
}

function renderIde(rows, etapa, comp) {
    if(chartI) chartI.destroy();
    let label = etapa.includes('2º') ? 'IDE Alfa' : (comp.includes('Port') ? 'IDE LP' : 'IDE MT');
    document.getElementById('titleIde').innerText = `Indicador: ${label}`;

    chartI = new Chart(document.getElementById('chartIde'), {
        type: 'line',
        data: {
            labels: rows.map(r => r.EDICAO),
            datasets: [{
                label: label,
                // LÓGICA DE LEITURA CORRIGIDA: Tenta IDE_ALFA, depois IDE_LP/MT, depois IDE genérico
                data: rows.map(r => {
                    return parseV(r.IDE_ALFA) || parseV(r.IDE_LP) || parseV(r.IDE_MT) || parseV(r.IDE) || 0;
                }),
                borderColor: '#10b981', pointBackgroundColor: '#10b981', tension: 0.3, fill: false, pointRadius: 5
            }]
        },
        options: { maintainAspectRatio: false, plugins: { datalabels: { anchor:'end', align:'top', font:{weight:'bold'}, formatter: v => v.toFixed(2) } } }
    });
}

function renderNiveis(rows, etapa) {
    const cont = document.getElementById('gridNiveis'); cont.innerHTML = '';
    const isA = etapa.includes('2º');
    rows.forEach((row, i) => {
        const id = `cn-${i}`; const cid = `card-nv-${i}`;
        let l, v, c;
        if(isA) {
            l = ['Não Alfab.', 'Incompleta', 'Intermediário', 'Suficiente', 'Desejável'];
            v = [parseV(row.NAO_ALFABETIZADOS), parseV(row.ALFABETIZACAO_INCOMPLETA), parseV(row.INTERMEDIARIO), parseV(row.SUFICIENTE), parseV(row.DESEJAVEL)];
            c = ['#ef4444', '#f97316', '#facc15', '#4ade80', '#166534'];
        } else {
            l = ['Muito Crítico', 'Crítico', 'Intermediário', 'Adequado'];
            v = [parseV(row.MUITO_CRITICO), parseV(row.CRITICO), parseV(row.INTERMEDIARIO), parseV(row.ADEQUADO)];
            c = ['#ef4444', '#facc15', '#4ade80', '#166534'];
        }
        cont.innerHTML += `<div class="glass-card" id="${cid}"><button class="btn btn-light shadow-sm btn-dl" onclick="baixarPNG('${cid}', 'Nivel_${row.EDICAO}')">PNG</button><h6>Edição ${row.EDICAO}</h6><div style="height:110px"><canvas id="${id}"></canvas></div></div>`;
        setTimeout(() => {
            new Chart(document.getElementById(id), {
                type: 'bar', data: { labels: [''], datasets: l.map((lab, idx) => ({ label: lab, data: [Math.round(v[idx])], backgroundColor: c[idx] })) },
                options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend:{position:'bottom', labels:{boxWidth:12}}, datalabels: { formatter: val => val > 0 ? val+'%' : '' } }, scales: { x:{stacked:true, max:100, display:false}, y:{stacked:true, display:false} } }
            });
        }, 150);
    });
}

function renderHistorico(rows) {
    const cont = document.getElementById('gridHistorico');
    cont.innerHTML = '<h5 class="fw-bold mb-4">Evolução de Proficiência</h5>';
    for(let i = 0; i < rows.length - 1; i++) {
        const vAtu = Math.round(parseV(rows[i].PROFICIENCIA_MEDIA));
        const vAnt = Math.round(parseV(rows[i+1].PROFICIENCIA_MEDIA));
        const diff = vAtu - vAnt;
        const trend = diff > 0 ? 'evo-up' : diff < 0 ? 'evo-down' : '';
        cont.innerHTML += `
            <div class="glass-card evolution-row ${trend} p-4 animate__animated animate__fadeInLeft">
                <div class="row align-items-center">
                    <div class="col-md-3"><b>${rows[i+1].EDICAO} <i class="fas fa-arrow-right mx-1 opacity-50"></i> ${rows[i].EDICAO}</b></div>
                    <div class="col-md-4 text-center">Diferença: <h3 class="fw-900 mb-0 d-inline">${diff > 0 ? '+' : ''}${diff}</h3> pts</div>
                    <div class="col-md-5 text-end"><h5 class="fw-800 mb-0">${diff > 0 ? '<i class="fas fa-arrow-up"></i> CRESCIMENTO' : '<i class="fas fa-arrow-down"></i> QUEDA'}</h5></div>
                </div>
            </div>`;
    }
}

async function baixarPNG(id, n) {
    const c = await html2canvas(document.getElementById(id), { scale: 2 });
    const l = document.createElement('a'); l.download = `${n}.png`; l.href = c.toDataURL(); l.click();
}

async function gerarPDF() {
    const c = await html2canvas(document.getElementById('content'), { scale: 2 });
    const d = new jspdf.jsPDF('p', 'mm', 'a4');
    d.addImage(c.toDataURL('image/png'), 'PNG', 10, 10, 190, (c.height * 190) / c.width);
    d.save('Relatorio_SPAECE.pdf');
}

window.onload = load;
</script>
</body>
</html>
