<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPAECE Analytics Pro V11.5</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/css/iziToast.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/js/iziToast.min.js"></script>

    <style>
        :root {
            --primary: #0f172a; --accent: #4f46e5;
            --c-vermelho: #ef4444; --c-laranja: #f97316; --c-amarelo: #facc15; 
            --c-verdelight: #4ade80; --c-verdedark: #166534;
        }

        body { background-color: #f1f5f9; font-family: 'Inter', sans-serif; }

        /* TELA DE ABERTURA BRANCA */
        #login-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: #ffffff;
            display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: #ffffff; border: 1px solid #e2e8f0; padding: 50px;
            border-radius: 30px; width: 100%; max-width: 450px; text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); color: #1e293b;
        }

        #sidebar { width: 300px; height: 100vh; position: fixed; background: var(--primary); color: white; padding: 30px; z-index: 100; }
        #content { margin-left: 300px; padding: 40px; min-height: 100vh; }

        .glass-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); margin-bottom: 30px; position: relative; border: 1px solid #e2e8f0; }
        .nav-pills .nav-link { color: #64748b; font-weight: 700; border-radius: 12px; padding: 12px 20px; }
        .nav-pills .nav-link.active { background: var(--accent); color: white; }

        .status-badge { padding: 12px 25px; border-radius: 50px; font-weight: 800; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px; }
        .up { background: #dcfce7; color: #15803d; }
        .down { background: #fee2e2; color: #b91c1c; }
        .equal { background: #f1f5f9; color: #475569; }

        footer { margin-top: 50px; text-align: center; color: #94a3b8; font-size: 0.8rem; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-card animate__animated animate__fadeIn">
        <div class="mb-4">
            <i class="fas fa-chart-line fa-4x text-accent mb-3"></i>
            <h2 class="fw-800 text-dark">SPAECE <span style="color:var(--accent)">PRO</span></h2>
            <p class="text-muted">Acesso ao Painel de Monitoramento</p>
        </div>
        <input type="text" id="inepInput" class="form-control form-control-lg bg-light border-1 text-center mb-4" placeholder="CÓDIGO INEP">
        <button class="btn btn-primary btn-lg w-100 fw-bold rounded-4 shadow" onclick="entrar()">ENTRAR</button>
    </div>
</div>

<div id="app" style="display:none;">
    <aside id="sidebar">
        <div class="mb-5 text-center">
            <h5 class="fw-bold mb-0">ANALYTICS V11.5</h5>
            <small class="text-white-50">SME Maracanaú</small>
        </div>
        <div class="mb-4">
            <label class="small fw-bold text-white-50">ETAPA</label>
            <select id="selEtapa" class="form-select bg-dark text-white border-0 mt-2" onchange="popularComponentes()"></select>
        </div>
        <div class="mb-4">
            <label class="small fw-bold text-white-50">COMPONENTE</label>
            <select id="selComp" class="form-select bg-dark text-white border-0 mt-2" onchange="render()"></select>
        </div>
        <hr class="opacity-25 my-5">
        <button class="btn btn-outline-danger w-100 mb-2" onclick="location.reload()">NOVA CONSULTA</button>
        <button class="btn btn-success w-100" onclick="gerarPDF()">GERAR PDF</button>
    </aside>

    <main id="content">
        <header class="mb-4">
            <h2 id="hEscola" class="fw-800 text-primary mb-1">---</h2>
            <span id="hInep" class="badge bg-white text-dark shadow-sm p-2">INEP: ---</span>
        </header>

        <ul class="nav nav-pills mb-4" id="pills-tab" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-prof">PROFICIÊNCIA</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-ide">INDICADOR IDE</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-niveis">NÍVEIS (100%)</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-hist">EVOLUÇÃO HISTÓRICA</button></li>
        </ul>

        <div class="tab-content" id="pills-tabContent">
            <div class="tab-pane fade show active" id="tab-prof"><div class="glass-card"><h5 class="fw-bold mb-4">Proficiência Média</h5><div style="height:400px"><canvas id="chartProf"></canvas></div></div></div>
            <div class="tab-pane fade" id="tab-ide"><div class="glass-card"><h5 id="titleIde" class="fw-bold mb-4">Indicador de Desempenho (IDE)</h5><div style="height:400px"><canvas id="chartIde"></canvas></div></div></div>
            <div class="tab-pane fade" id="tab-niveis"><div id="gridNiveis"></div></div>
            <div class="tab-pane fade" id="tab-hist"><div id="gridHistorico"></div></div>
        </div>
        <footer>© 2026 SME Maracanaú</footer>
    </main>
</div>

<script>
let database = [];
let chartProfInstance = null;
let chartIdeInstance = null;
Chart.register(ChartDataLabels);

async function load() {
    try {
        const [rS, rA] = await Promise.all([
            fetch('result_spaece.json').then(r => r.json()),
            fetch('result_alfa.json').then(r => r.json())
        ]);
        database = [...rS, ...rA];
    } catch(e) { console.error("Erro ao carregar arquivos JSON"); }
}

function entrar() {
    const inep = document.getElementById('inepInput').value;
    const find = database.find(d => String(d.INEP_ESC || d.INEP) === inep);
    if(find) {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        
        // ORDEM: 2º, 5º, 9º
        const etapas = [...new Set(database.filter(d => String(d.INEP_ESC || d.INEP) === inep).map(d => d.ETAPA))].sort((a,b) => parseInt(a) - parseInt(b));
        document.getElementById('selEtapa').innerHTML = etapas.map(e => `<option>${e}</option>`).join('');
        popularComponentes();
    } else { iziToast.error({title:'Erro', message:'INEP não localizado.'}); }
}

function popularComponentes() {
    const inep = document.getElementById('inepInput').value;
    const etapa = document.getElementById('selEtapa').value;
    
    // ORDEM: Lingua Portuguesa depois Matematica
    const comps = [...new Set(database.filter(d => String(d.INEP_ESC || d.INEP) === inep && d.ETAPA === etapa).map(d => d.COMPONENTE_CURRICULAR || d.DISCIPLINA))].sort((a,b) => b.localeCompare(a));
    document.getElementById('selComp').innerHTML = comps.map(c => `<option>${c}</option>`).join('');
    render();
}

function parseVal(v) {
    if(!v) return 0;
    return parseFloat(String(v).replace('%', '').replace(',', '.')) || 0;
}

function render() {
    const inep = document.getElementById('inepInput').value;
    const etapa = document.getElementById('selEtapa').value;
    const comp = document.getElementById('selComp').value;
    
    const rowsBase = database.filter(d => String(d.INEP_ESC || d.INEP) === inep && d.ETAPA === etapa && (d.COMPONENTE_CURRICULAR === comp || d.DISCIPLINA === comp));
    
    const rowsAsc = [...rowsBase].sort((a,b) => a.EDICAO - b.EDICAO); // Para os gráficos de linha/barra (ordem cronológica)
    const rowsDesc = [...rowsBase].sort((a,b) => b.EDICAO - a.EDICAO); // Para os Cards (mais recente primeiro)

    document.getElementById('hEscola').innerText = rowsAsc[0].ESCOLA || rowsAsc[0].NO_MUNICIPIO;
    document.getElementById('hInep').innerText = `INEP: ${inep} | ${etapa} | ${comp}`;

    renderProf(rowsAsc);
    renderIde(rowsAsc, etapa, comp);
    renderNiveis(rowsDesc, etapa);
    renderHistorico(rowsDesc);
}

function renderProf(rows) {
    if(chartProfInstance) chartProfInstance.destroy();
    const ctx = document.getElementById('chartProf').getContext('2d');
    chartProfInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: rows.map(r => r.EDICAO),
            datasets: [{ label: 'Proficiência', data: rows.map(r => Math.round(parseVal(r.PROFICIENCIA_MEDIA))), backgroundColor: '#4f46e5', borderRadius: 10 }]
        },
        options: { maintainAspectRatio: false, plugins: { datalabels: { anchor:'end', align:'top', font:{weight:'bold'} } } }
    });
}

function renderIde(rows, etapa, comp) {
    if(chartIdeInstance) chartIdeInstance.destroy();
    const ctx = document.getElementById('chartIde').getContext('2d');
    
    let labelIde = etapa.includes('2º') ? 'IDE-ALFA' : (comp.includes('Port') ? 'IDE-LP' : 'IDE-MT');
    document.getElementById('titleIde').innerText = `Indicador: ${labelIde}`;

    chartIdeInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: rows.map(r => r.EDICAO),
            datasets: [{
                label: labelIde,
                data: rows.map(r => parseVal(r.IDE_ALFA || r.IDE_LP || r.IDE_MT || r.IDE)),
                borderColor: '#10b981', backgroundColor: '#10b981', tension: 0.3, fill: false, pointRadius: 6
            }]
        },
        options: {
            maintainAspectRatio: false,
            plugins: { datalabels: { anchor:'end', align:'top', font:{weight:'bold'}, formatter: v => v.toFixed(1) } }
        }
    });
}

function renderNiveis(rows, etapa) {
    const cont = document.getElementById('gridNiveis');
    cont.innerHTML = '';
    const isAlfa = etapa.includes('2º');

    rows.forEach((row, i) => {
        const canvasId = `cn-${i}`;
        let labels, values, cores;
        if(isAlfa) {
            labels = ['Não Alfab.', 'Incompleta', 'Intermediário', 'Suficiente', 'Desejável'];
            values = [parseVal(row.NAO_ALFABETIZADOS), parseVal(row.ALFABETIZACAO_INCOMPLETA), parseVal(row.INTERMEDIARIO), parseVal(row.SUFICIENTE), parseVal(row.DESEJAVEL)];
            cores = ['#ef4444', '#f97316', '#facc15', '#4ade80', '#166534'];
        } else {
            labels = ['Muito Crítico', 'Crítico', 'Intermediário', 'Adequado'];
            values = [parseVal(row.MUITO_CRITICO), parseVal(row.CRITICO), parseVal(row.INTERMEDIARIO), parseVal(row.ADEQUADO)];
            cores = ['#ef4444', '#facc15', '#4ade80', '#166534'];
        }

        cont.innerHTML += `<div class="glass-card"><h6>Edição ${row.EDICAO}</h6><div style="height:100px"><canvas id="${canvasId}"></canvas></div></div>`;
        setTimeout(() => {
            new Chart(document.getElementById(canvasId), {
                type: 'bar', data: { labels: [''], datasets: labels.map((l, idx) => ({ label: l, data: [Math.round(values[idx])], backgroundColor: cores[idx] })) },
                options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend:{position:'bottom'}, datalabels: { formatter: v => v+'%' } }, scales: { x:{stacked:true, max:100}, y:{stacked:true} } }
            });
        }, 150);
    });
}

function renderHistorico(rows) {
    const cont = document.getElementById('gridHistorico');
    cont.innerHTML = '<h5 class="fw-bold mb-4">Evolução Histórica (Recente para Antigo)</h5>';
    for(let i = 0; i < rows.length - 1; i++) {
        const atual = Math.round(parseVal(rows[i].PROFICIENCIA_MEDIA));
        const anterior = Math.round(parseVal(rows[i+1].PROFICIENCIA_MEDIA));
        const diff = atual - anterior;
        let badge = diff > 0 ? 'up' : diff < 0 ? 'down' : 'equal';
        cont.innerHTML += `
            <div class="glass-card"><div class="row align-items-center">
                <div class="col-md-4"><b>${rows[i].EDICAO}</b> vs <b>${rows[i+1].EDICAO}</b></div>
                <div class="col-md-4 text-center">Variação: <span class="fw-800">${diff > 0 ? '+' : ''}${diff} pts</span></div>
                <div class="col-md-4 text-end"><div class="status-badge ${badge}">${diff >= 0 ? 'CRESCIMENTO' : 'QUEDA'}</div></div>
            </div></div>`;
    }
}

async function gerarPDF() {
    const canvas = await html2canvas(document.getElementById('content'));
    const doc = new jspdf.jsPDF('p', 'mm', 'a4');
    doc.addImage(canvas.toDataURL('image/png'), 'PNG', 10, 10, 190, (canvas.height * 190) / canvas.width);
    doc.save('SPAECE_Relatorio.pdf');
}

window.onload = load;
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
